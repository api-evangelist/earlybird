aid: earlybird
name: Earlybird Venture Capital
description: >-
  Earlybird Venture Capital is a pan-European venture capital firm founded in
  1997 and headquartered in Berlin, with additional offices in Munich, London,
  and Milan. Earlybird identifies and backs exceptional early-stage technology
  companies across Europe, investing from pre-seed and seed through Series A with
  initial tickets up to roughly EUR 12 million, and following on through growth.
  The firm organizes around specialized fund streams: Digital West (Western
  Europe), Digital East (emerging Europe and Turkey), Health, Earlybird-X
  (pre-seed and university spinouts), and a pan-Earlybird Growth Opportunities
  fund. Its thesis spans Applications (B2B and B2C), Software Infrastructure, and
  DeepTech, with active investment in fintech, generative AI, deep tech, and
  frontier areas such as nuclear fusion and space. With more than EUR 2 billion
  (self-reported ~EUR 2.5B) under management, Earlybird is one of Europe's most
  established and active venture firms, with a track record including multiple
  IPOs and dozens of trade sales, and notable investments such as UiPath, N26,
  Aiven, Isar Aerospace, and Peak Games.
